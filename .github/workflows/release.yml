name: Release — XCFramework + AAR

on:
  push:
    tags: ["v*"]
  # Lets the packaging path be exercised without cutting a tag; the release
  # job below is tag-only, so a manual run builds artifacts and publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Single source of truth for the Android NDK the release artifacts are
  # built against. Bump deliberately; artifacts are not reproducible across
  # NDK versions.
  NDK_VERSION: "27.2.12479018"

jobs:
  # ── Generate bindings on Linux (fast) ──────────────────────────────
  bindings:
    name: Generate bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make bindings
      - uses: actions/upload-artifact@v6
        with:
          name: bindings
          path: bindings/

  # ── iOS / XCFramework (requires macOS) ─────────────────────────────
  ios:
    name: Build XCFramework
    runs-on: macos-latest
    needs: bindings
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v5
      # Toolchain version and targets both come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: bindings
          path: bindings/
      - run: make xcframework
      - name: Package XCFramework
        run: |
          cd target
          zip -r zk_cred_longfellow.xcframework.zip zk_cred_longfellow.xcframework
      - uses: actions/upload-artifact@v6
        with:
          name: xcframework
          path: target/zk_cred_longfellow.xcframework.zip

  # ── Android / AAR (requires NDK) ──────────────────────────────────
  android:
    name: Build AAR
    runs-on: ubuntu-latest
    needs: bindings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Toolchain version and targets both come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      # setup-android@v4 accepts NEITHER `api-level` NOR `ndk-version` --
      # passing them is silently ignored (it warns "Unexpected input(s)" and
      # falls back to its default `packages: tools platform-tools`, installing
      # no NDK at all). Builds then use whatever NDK the runner image happens
      # to ship, which can change under us without any change here. Install
      # the NDK explicitly and point cargo-ndk at that exact one.
      - uses: android-actions/setup-android@v4
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"
      - name: Pin cargo-ndk to the installed NDK
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -d "$NDK_HOME" || { echo "::error::NDK not found at $NDK_HOME"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Pinned ANDROID_NDK_HOME=$NDK_HOME"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/download-artifact@v8
        with:
          name: bindings
          path: bindings/
      # Tag-only: on a manual run GITHUB_REF_NAME is a branch name, which
      # must not end up as a package version.
      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build AAR
        run: make aar ${PKG_VERSION:+VERSION=$PKG_VERSION}
      - name: Generate Maven POM
        run: make pom ${PKG_VERSION:+VERSION=$PKG_VERSION}
      - name: Publish AAR to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          AAR=$(ls target/zk_cred_longfellow-*.aar)
          POM=$(ls target/zk-cred-longfellow-*.pom)
          mvn -B deploy:deploy-file \
            --settings /tmp/settings.xml \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile="$POM" \
            -Dfile="$AAR" \
            -Dpackaging=aar
      - uses: actions/upload-artifact@v6
        with:
          name: aar
          path: |
            target/zk_cred_longfellow-*.aar
            target/zk-cred-longfellow-*.pom

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ios, android, bindings]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: xcframework
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: aar
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: bindings
          path: artifacts/bindings/
      - name: Package bindings
        run: cd artifacts && zip -r bindings.zip bindings/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/zk_cred_longfellow.xcframework.zip
            artifacts/zk_cred_longfellow-*.aar
            artifacts/zk-cred-longfellow-*.pom
            artifacts/bindings.zip
