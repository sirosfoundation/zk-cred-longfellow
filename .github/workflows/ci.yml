name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install the pinned Rust toolchain
      # Version, components and targets all come from rust-toolchain.toml.
      uses: ./.github/actions/rust-toolchain
    - name: Build
      run: cargo build --locked
    - name: Format
      run: cargo fmt --message-format human -- --check
    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets -- -Dwarnings
    - name: Document
      run: cargo doc --locked
      env:
        RUSTDOCFLAGS: "-D warnings"
    - name: Test
      # debug_eu_offsets is marked #[ignore] (known-failing debug helper,
      # see its own doc comment in prover_v8_test.rs) rather than skipped
      # via a CLI flag here - the bench targets below are harness=false
      # (criterion) and don't understand libtest's `--skip`, so any skip
      # flag added at this level would break them instead.
      run: cargo test --locked
    - name: Test benchmarks
      run: cargo test --locked --benches
    - name: "Check for #[test] macro"
      run: |
        bash -c "! grep -r '#\[test\]' src"
    - name: Check uniffi build
      run: cargo check --locked --features uniffi
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2.0.15
      with:
        command: check bans licenses sources

  wasm-node:
    runs-on: ubuntu-latest
    steps:
    - name: Install Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "22"
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.7
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --version 0.13.1
    - uses: actions/checkout@v5
    - name: Install the pinned Rust toolchain
      # Version, components and targets all come from rust-toolchain.toml.
      uses: ./.github/actions/rust-toolchain
    - name: Test (Node.js)
      run: wasm-pack test --node

  wasm-firefox:
    runs-on: ubuntu-latest
    steps:
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.7
    - name: Install wasm-pack
      run: cargo binstall wasm-pack --version 0.13.1
    - uses: actions/checkout@v5
    - name: Install the pinned Rust toolchain
      # Version, components and targets all come from rust-toolchain.toml.
      uses: ./.github/actions/rust-toolchain
    - name: Test (Firefox)
      run: wasm-pack test --firefox --headless
      env:
        WASM_BINDGEN_USE_BROWSER: "1"

  # Line coverage of the nym_auth module only. It uploads the lcov file and prints a per-file table;
  # the threshold applies to src/nymauth, not to the ISRG code, and no other job depends on it.
  nymauth-coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.15.7
    - uses: actions/checkout@v5
    - name: Install the pinned Rust toolchain
      # Version, components and targets all come from rust-toolchain.toml.
      uses: ./.github/actions/rust-toolchain
    - name: Install coverage tools
      run: |
        cargo binstall --no-confirm cargo-llvm-cov --version 0.8.7
    - name: Run the nymauth tests with coverage
      run: "cargo llvm-cov --locked --release --features uniffi --lib --lcov --output-path lcov.info -- nymauth::"
    - name: Summary and threshold
      run: python3 .github/scripts/nymauth_coverage.py lcov.info 90
    - name: Upload lcov
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nymauth-lcov
        path: lcov.info

  rustsec-advisories:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2.0.15
      with:
        command: check advisories
