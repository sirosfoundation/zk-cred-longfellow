# Exact toolchain pin: the single source of truth. rustup honours this file for
# every local cargo/rustc, and CI installs from it through
# .github/actions/rust-toolchain, so local and CI builds use the same compiler.
#
# Why exact: a floating channel makes every Rust release silently a CI change.
# 1.98.0 made clippy::chunks_exact_to_as_chunks warn-by-default and turned
# `main` red with no commit behind it.
#
# To bump: change `channel` (Dependabot's `rust-toolchain` ecosystem opens this
# PR monthly), in its own commit, so a lint or codegen change is attributable to
# the bump rather than to whatever merged that day. Run fmt, clippy and tests.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
# Declared here rather than per-job in the workflows, so every job and every
# local checkout installs the same set.
targets = [
  "wasm32-unknown-unknown",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]
